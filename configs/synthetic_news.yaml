# News-article LLM batch. See configs/synthetic_reference.yaml.

# --- Core ---
seed: 42
num_documents: 20
engine: llm
document_type: news_article
# document_types:
#   - type: news_article
#     weight: 1.0
document_profiles_dir: document_profiles
# domain: news_article

# --- Text length (profile news_article sets 300–1200 if omitted here) ---
# text_length:
#   min_chars: 300
#   max_chars: 1200

entities_per_document:
  distribution: fixed # uniform | fixed | poisson
  fixed: 5
  # min: 3
  # max: 8
  # lambda: 6.0

# --- Label mix (omit => defaults + profile) ---
# label_weights:
#   organization: 0.2
#   location: 0.15

# --- Optional ---
# lexicon:
#   organization: [Reuters, AP]
# generators:
#   date:
#     formats: ["%B %d, %Y"]
# templates:
#   - "Breaking: {e0} announced {e1}."

llm:
  model: openai/gpt-oss-120b:free
  agent_mode: per_doc # per_doc | stateless
  provider_max_attempts: 2
  validation_max_attempts: 8
  max_restarts: 2
  parallelism: 5
  prompt_file: prompts/synthetic_llm_system_prompt.txt
  user_prompt_file: prompts/synthetic_llm_user_prompt.txt
  feedback_prompt_file: prompts/synthetic_llm_feedback_prompt.txt
  # max_attempts: 3
  # temperature: 0.4
  # timeout_seconds: 120
  # request_delay_seconds: 0
  # document_log_dir: logs_tmp
  # agno_db_path: ""
