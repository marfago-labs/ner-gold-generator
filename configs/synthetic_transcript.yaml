# Interview/transcript LLM batch. See configs/synthetic_reference.yaml.
# Speaker turn labels (Host:/Guest:) come from the profile, not planned entities.

# --- Core ---
seed: 99
num_documents: 10
engine: llm
document_type: transcript
# document_types:
#   - type: transcript
#     weight: 1.0
document_profiles_dir: document_profiles
# domain: transcript

# --- Text length (profile may override) ---
# text_length:
#   min_chars: 500
#   max_chars: 2000

entities_per_document:
  distribution: fixed # uniform | fixed | poisson
  fixed: 5
  # min: 3
  # max: 8
  # lambda: 6.0

# --- Label mix (person names planned once; avoid Host/Guest in lexicon) ---
# label_weights:
#   person: 0.25
#   organization: 0.15

# --- Optional ---
# lexicon:
#   person: [Alex Rivera, Jordan Lee]
# generators:
#   date:
#     formats: ["%B %d, %Y"]
# templates:
#   - "Host: Today we welcome {e0} from {e1}."

llm:
  model: openai/gpt-oss-120b:free
  agent_mode: per_doc # per_doc | stateless
  provider_max_attempts: 2
  validation_max_attempts: 8
  max_restarts: 2
  parallelism: 3
  prompt_file: prompts/synthetic_llm_system_prompt.txt
  user_prompt_file: prompts/synthetic_llm_user_prompt.txt
  feedback_prompt_file: prompts/synthetic_llm_feedback_prompt.txt
  # max_attempts: 3
  # temperature: 0.4
  # timeout_seconds: 120
  # request_delay_seconds: 0
  # document_log_dir: logs_tmp
  # agno_db_path: ""
