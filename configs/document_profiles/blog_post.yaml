id: blog_post
style_description: >
  An informal blog post in first person. Conversational tone, short sections
  or a single flowing post. Opinions and personal asides are fine.
templates:
  - "I tried {e0} with {e1} last week and saw {e2} compared to {e3} on {e4}."
  - "After reading about {e0}, I paired it with {e1} and tracked {e2} using {e3} in {e4}."
lexicon:
  person: ["Alex", "Sam", "Jordan"]
  organization: ["GitHub", "Hugging Face", "Medium"]
label_weights:
  person: 0.15
  organization: 0.15
  method: 0.15
  model: 0.1
text_length:
  min_chars: 250
  max_chars: 1000
