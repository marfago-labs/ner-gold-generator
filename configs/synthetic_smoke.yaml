# Minimal procedural smoke test (no API). See configs/synthetic_reference.yaml.

# --- Core ---
seed: 42
num_documents: 3
engine: procedural # procedural | llm
domain: scientific_abstract
# document_type: scientific_abstract
# document_types:
#   - type: news_article
#     weight: 1.0
# document_profiles_dir: document_profiles

text_length:
  min_chars: 80
  max_chars: 400

entities_per_document:
  distribution: fixed # uniform | fixed | poisson
  fixed: 4
  # min: 3
  # max: 8
  # lambda: 6.0

label_weights:
  model: 0.2
  dataset: 0.2
  date: 0.15
  number: 0.15
  percentage: 0.1
  currency: 0.1
  year: 0.1

