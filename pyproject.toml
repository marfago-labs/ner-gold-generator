[project]
name = "ner-gold-generator"
version = "0.1.0"
description = "Build NER benchmark gold JSONL from arXiv, YouTube, document folders, or JSONL (manual or LLM consensus)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "jiter>=0.15.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-randomly>=3.15.0",
    "pyyaml>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
build-gold = "ner_gold_generator.build_gold:main"
build-arxiv-gold = "ner_gold_generator.build_arxiv:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ner_gold_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# pytest-randomly (dev dep) shuffles test order; seed from git commit or --randomly-seed

[tool.coverage.run]
source = ["ner_gold_generator"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["ner_gold_generator", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ner_gold_generator"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
packages = ["ner_gold_generator"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
